# @package _global_
# Arm b1m, conservative three-rod pendulum: LeWM with the symmetric 3-frame temporal
# encoder (W=3) -- the same TemporalConvEncoder, built by the same factory as the
# Hamiltonian models, so the baseline can also see velocity in its input.
#
# Clips: T = 13 pixel frames -> 11 latent frames (W=3 consumes 2) -> 8 unrolled steps.
defaults:
  - override /model: lewm_ms_conv
  - override /data: pendulum_multi_v2

phase: 0
run_suffix: _ms_conv_te_w3_multi_exp066_b1m
history_size: 3
num_preds: 10   # T = 13 = 11 + (W-1); T_eff = 11
allow_num_steps_mismatch: true

model:
  enc_window: 3
  enc_variant: full

loss:
  sigreg:
    weight: 0.25

trainer:
  max_epochs: 100

loader:
  batch_size: 32
  num_workers: 3   # low, so that several runs can share one GPU
