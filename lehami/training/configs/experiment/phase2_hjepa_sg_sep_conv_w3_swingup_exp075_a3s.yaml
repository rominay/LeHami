# @package _global_
# Arm a3s: Hamiltonian flow (LeHami) with the symmetric 3-frame temporal encoder
# (W=3), SIGReg on [q, p] jointly. Identical to a0s except for the encoder window. The
# kernel is symmetric in time, so it gives the encoder access to velocity without
# breaking the time-reversal structure (q stays even in omega).
#
# Actuated pendulum (pendulum_swingup): 630 train episodes, so 35 epochs give about
# the same number of optimiser steps as 100 epochs on the three-rod set.
# Clips: T = 16 pixel frames -> 14 latent frames (W=3 consumes 2), as for a0s.
defaults:
  - override /model: hjepa_sg_sep_sreg_joint_ms_conv
  - override /data: pendulum_swingup

phase: 2
run_suffix: _sg_sep_conv_w3_swingup_exp075_a3s
history_size: 1
num_preds: 15   # T = 16 = T_eff(14) + (W-1); W=3 eats two lead-in frames
allow_num_steps_mismatch: true

model:
  latent_dim: 32
  enc_window: 3
  enc_variant: full

loss:
  sigreg:
    weight: 0.25

trainer:
  max_epochs: 35
  gradient_clip_val: 1.0

loader:
  batch_size: 32
  num_workers: 3   # low, so that several runs can share one GPU
