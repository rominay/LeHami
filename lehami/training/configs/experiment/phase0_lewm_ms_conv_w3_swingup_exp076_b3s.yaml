# @package _global_
# Arm b3s: LeWM with the symmetric 3-frame temporal encoder (W=3). At W=1 the baseline's
# encoder sees one frame and cannot represent velocity in its input; at W=3 it can, so
# this arm tests whether the Hamiltonian models' advantage survives when the baseline
# is also given velocity information.
#
# Actuated pendulum (pendulum_swingup): 630 train episodes, so 35 epochs give about
# the same number of optimiser steps as 100 epochs on the three-rod set.
# Clips: T = 13 pixel frames -> 11 latent frames (W=3 consumes 2) -> 8 unrolled steps.
defaults:
  - override /model: lewm_ms_conv
  - override /data: pendulum_swingup

phase: 0
run_suffix: _ms_conv_w3_swingup_exp076_b3s
history_size: 3
num_preds: 10   # T = 13 = T_eff(11) + (W-1); W=3 eats two lead-in frames
allow_num_steps_mismatch: true

model:
  enc_window: 3
  enc_variant: full

loss:
  sigreg:
    weight: 0.25

trainer:
  max_epochs: 35

loader:
  batch_size: 32
  num_workers: 3   # low, so that several runs can share one GPU
