# @package _global_
# Arm a0s: Hamiltonian flow (LeHami), per-frame ConvNet encoder (W=1), SIGReg on
# [q, p] jointly. The actuated counterpart of a0m: same model and clip budget, and the
# torque now conditions V(q, u) through the action embedding.
#
# Actuated pendulum (pendulum_swingup): 630 train episodes, so 35 epochs give about
# the same number of optimiser steps as 100 epochs on the three-rod set.
# Clips: T = 14 -> causal anchor window 0..3 + 8 unrolled steps + 2 centered-tail frames.
defaults:
  - override /model: lehami_sg_sep_sreg_joint_ms_conv
  - override /data: pendulum_swingup

phase: 2
run_suffix: _sg_sep_conv_w1_swingup_exp071_a0s
history_size: 1
num_preds: 13   # T = 14 = T_eff (no temporal lead-in at W=1)
allow_num_steps_mismatch: true

model:
  latent_dim: 32
  enc_window: 1
  enc_variant: full   # ignored at W=1

loss:
  sigreg:
    weight: 0.25

trainer:
  max_epochs: 35
  gradient_clip_val: 1.0

loader:
  batch_size: 32
  num_workers: 3   # low, so that several runs can share one GPU
