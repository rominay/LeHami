# Actuated pendulum: 3 rod lengths x 3 bob masses at one frame rate (dt = 0.1 s),
# 100 episodes per cell = 900 episodes x 80 frames, driven by a random torque.
# Generated by lehami/data/pendulum_swingup.py.
#
# The mass enters the dynamics only through the torque term,
# theta'' = -(g/L) sin(theta) + u / (m L^2), so it sets the control authority.
# Both parameters are visible in the frame: the rod is drawn to scale in L and the
# bob radius scales as m^(1/3), so a per-frame encoder can identify them.
name: pendulum_swingup   # resolves to $STABLEWM_HOME/pendulum_swingup.h5
frameskip: 1
action_dim: 1             # scalar torque
keys_to_load:
  - pixels                # the state is not used for training, only for probing at eval
  - action                # per-frame torque, feeding V(q, u). Without this key the
                          # builders fall back to a zero token and the run is unactuated.
  - dt_frame              # per-frame episode dt; used only when model.dt_ref is set,
                          # to build the step h = dt / dt_ref
