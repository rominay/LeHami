# Conservative single-rod pendulum: 500 episodes x 100 frames, dt = 0.05 s.
# Generated by lehami/data/generate_pendulum.py.
name: pendulum         # resolves to $STABLEWM_HOME/pendulum.h5
frameskip: 1
