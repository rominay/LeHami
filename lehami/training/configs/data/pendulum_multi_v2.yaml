# Conservative pendulum with three rod lengths (0.7, 1.0, 1.4 m) x four frame rates,
# 100 episodes per cell, each an 8 s window. Generated by
# lehami/data/pendulum_multi.py.
#
# Pair it with a SINGLE-rate manifest (the paper uses the dt x 2 slice,
# `data_prep.py --restrict-dt-mults 2`). The predictor advances one frame with one
# learned step size and has no input that says which rate an episode used, so on a
# mixed-rate manifest "one frame" would mean a different time step per episode. The
# rod length, by contrast, is visible in the frame, so q can encode it.
name: pendulum_multi_v2   # resolves to $STABLEWM_HOME/pendulum_multi_v2.h5
frameskip: 1
action_dim: 1             # unactuated; a 1-dim zero token is fed to the action encoder
keys_to_load:
  - pixels                # the state is not used for training, only for probing at eval
  - dt_frame              # per-frame episode dt; used only when model.dt_ref is set,
                          # to build the step h = dt / dt_ref
