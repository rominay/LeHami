# DINO-WM baseline for the frozen-DINOv2 comparison: DINO-WM's ViTPredictor on
# exactly the features and projector of hjepa_sg_sep_sreg_q_ms_dino, so the
# predictor is the only difference between the two arms.
#
# Faithful to DINO-WM (third_party/dino_wm @ 0a9492f): models/vit.py::ViTPredictor
# (block-causal transformer over flattened space-time tokens), the CLS feature key
# of conf/encoder/dino_cls.yaml (num_patches = 1), and the concat_dim=1 action
# handling of conf/train.yaml (the action embedding is concatenated on the feature
# axis, widening each token to latent_dim + action_emb_dim). Not faithful: upstream
# predicts in the raw 384-d DINO space with no projector and trains single-step; here
# the projector bottleneck and multi-step rollout match the Hamiltonian arm. This is
# DINO-WM's CLS variant; their default feature key is x_norm_patchtokens.
name: dino_wm_cls

# frozen encoder, identical to hjepa_sg_sep_sreg_q_ms_dino
encoder: dino
dino_name: dinov2_vits14
dino_feature_key: x_norm_clstoken
dino_img_size: 224
freeze_encoder: true

# 2 x 32: as wide as the Hamiltonian arm's (q, p) together, so neither arm has more
# state (the same convention as lewm_ms_conv).
latent_dim: 64

# DINO-WM conf/train.yaml: action_emb_dim=10, num_action_repeat=1.
action_emb_dim: 10

# DINO-WM conf/predictor/vit.yaml (dim_head is their code default); the same
# depth/heads/mlp_dim as the LeWM predictor in lewm_ms_conv.yaml, so the two
# baselines differ in architecture rather than in capacity.
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0
  pool: mean
