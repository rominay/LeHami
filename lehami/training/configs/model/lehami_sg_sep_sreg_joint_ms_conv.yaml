# Hamiltonian flow (LeHami) with the ConvNet encoder: identical to
# lehami_sg_sep_sreg_joint_ms except that the ViT-tiny encoder (~5.7M params) is
# replaced by the 4-block ConvEncoder (~315K params). Encoder and flow are trained
# end to end from random initialisation. SIGReg acts on [q, p] jointly.
name: lehami_sg_sep_sreg_joint_ms_conv

patch_size: 8           # unused by the ConvEncoder
latent_dim: 192         # d; phase space = R^{2d}

fd_dt: 1.0
momentum_weight: 1.0

ham_flow:
  hidden_dim: 1024
  n_layers: 3
  dt: 1.0
  phase_space: true
  separable: true
  learnable_scale: true
