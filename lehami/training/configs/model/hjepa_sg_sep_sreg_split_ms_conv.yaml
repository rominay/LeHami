# Hamiltonian flow (LeHami) with the ConvNet encoder, SIGReg on q and p separately.
# Identical to hjepa_sg_sep_sreg_joint_ms_conv except for where SIGReg is applied.
name: hjepa_sg_sep_sreg_split_ms_conv

patch_size: 8           # unused by the ConvEncoder
latent_dim: 192         # d; phase space = R^{2d}

fd_dt: 1.0
momentum_weight: 1.0

ham_flow:
  hidden_dim: 1024
  n_layers: 3
  dt: 1.0
  phase_space: true
  separable: true
  learnable_scale: true

# SIGReg on q and p independently, each with its own weight.
sigreg_mode: split
# Weight of the p statistic (defaults to loss.sigreg.weight when unset).
sigreg_p_weight: 0.25
