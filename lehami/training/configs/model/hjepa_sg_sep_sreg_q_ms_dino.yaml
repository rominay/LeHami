# Hamiltonian flow (LeHami) on a frozen DINOv2 encoder, for the comparison with the
# DINO-WM predictor (dino_wm_cls). Identical to hjepa_sg_sep_sreg_q_ms_conv --
# Savitzky-Golay momentum, separable Hamiltonian flow, multi-step rollout, SIGReg on
# q only -- except that the trained-from-scratch ConvEncoder is replaced by a frozen
# DINOv2, so only the projector adapts its features.
name: hjepa_sg_sep_sreg_q_ms_dino

# Frozen encoder (DINO-WM's models/dino.py, third_party/dino_wm @ 0a9492f). The CLS
# key gives one 384-d vector per frame, and the projector maps it to q. Frames arrive
# at 64x64 and are upsampled inside the encoder to dino_img_size, which must be a
# multiple of the DINOv2 patch size (14).
encoder: dino
dino_name: dinov2_vits14
dino_feature_key: x_norm_clstoken
dino_img_size: 224
freeze_encoder: true

patch_size: 8           # unused by the DINO encoder
latent_dim: 32          # d; phase space = R^{2d} = R^64

fd_dt: 1.0
momentum_weight: 1.0

ham_flow:
  hidden_dim: 1024
  n_layers: 3
  dt: 1.0
  phase_space: true
  separable: true
  learnable_scale: true

# SIGReg on q only; p carries no distributional constraint, so its scale is set by
# the dynamics alone (sigreg_p_weight is therefore not used).
sigreg_mode: q
