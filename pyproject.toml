[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lehami"
version = "0.1.0"
description = "LeHami: Symplectic Latent Dynamics for World Models"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Romina Yalovetzky", email = "romina.yalovetzky@nyu.edu"},
    {name = "Randall Balestriero"},
    {name = "Yann LeCun"},
]
requires-python = ">=3.10"
dependencies = [
    # LeWorldModel runtime deps (installs stable_pretraining + stable_worldmodel + lightning)
    "stable-worldmodel[train,env]",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    "einops>=0.7.0",
    "submitit>=1.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
]

# The baselines are cloned, not vendored (see README) into
# lehami/models/third_party/ and added to sys.path at import time:
#   leworldmodel  https://github.com/lucas-maes/le-wm
#                 pinned commit 8edfeb336732b5f3ce7b8b210d0ba370a09e2cac
#   dino_wm       https://github.com/gaoyuezhou/dino_wm
#                 pinned commit 0a9492fa12044b852ae9e001cc74604b79c8bb0c

[tool.hatch.build.targets.wheel]
packages = ["lehami/models/lehami"]

[tool.ruff]
line-length = 100
src = ["lehami/models"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["lehami/tests"]
